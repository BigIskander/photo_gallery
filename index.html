<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Photo gallery.</title>
        <meta name="description" content="Photo gallery, vanilla JS script.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- gallery script -->
        <link rel="stylesheet" href="/src/css/gallery.css">
        <script src="/src/js/gallery.js"></script>
        <!-- images for example -->
        <script src="/src/js/json_variable.js"></script>
        <!-- zoom in script copied from my personal website -->
        <link rel="stylesheet" href="/src/css/zoom_in_out.css">
        <script src="/src/js/zoom_in_out.js"></script>
        <!-- some of dark theme styles -->
        <link rel="stylesheet" href="/src/css/dark_theme.css">
    </head>
    <body>
        <script src="/src/js/switch_theme.js"></script>
        <a onclick="switch_theme()" href="JavaScript:void(0);" class="switch_theme_link">Переключить тему.</a>
        <div id="content" style="margin-top: 50px;">
            <!--  style="display: flex; justify-content: center;" -->
            <div id="gallery"></div>
            <script>
                galleryCreate("gallery", images, "My gallery...", zoomInImage);
            </script>
            <!-- Add second instance for test -->
            <div id="gallery2"></div>
            <script>
                galleryCreate("gallery2", images.reverse(), "My gallery...");
            </script>
        </div>
        <!-- This part (below) is copied from my personal website: https://bigiskander.github.io -->
        <div class="image_zoom_div">
            <a href="JavaScript:void(0);" onclick="zoomOutImage()" class="zoom_me_out">Закрыть.</a>
            <img class="image_zoom_preload" />
            <img class="image_zoom" />
            <a target="_blank" class="image_zoom_open_url">Открыть изображение в новой вкладке.</a>
            <!-- https://tobiasahlin.com/spinkit/ //-->
            <div class="image_loading_spinner gallery_image_loading"></div>
        </div>
    </body>
